name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore IdempotencyGate.slnx

      - run: dotnet build IdempotencyGate.slnx --no-restore -c Release

      - run: dotnet test IdempotencyGate.slnx --no-build -c Release --logger "console;verbosity=normal"
